<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cart – FoodRush</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="css/style.css"/></head>
<body>
<nav class="navbar navbar-expand-lg"><div class="container">
  <a class="navbar-brand" href="index.html"><i class="fas fa-utensils me-2"></i>FoodRush</a>
  <div class="ms-auto d-flex gap-3 align-items-center">
    <a href="menu.html" class="nav-link">Menu</a>
    <a href="cart.html" class="nav-link"><i class="fas fa-shopping-cart me-1"></i>Cart <span class="cart-badge" id="cartCount">0</span></a>
    <button class="theme-toggle" onclick="toggleTheme()"></button>
  </div>
</div></nav>
<div class="container py-5">
  <h1 class="section-title mb-4">Your Cart</h1>
  <div class="row g-4" id="mainCart"></div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => { updateCartCount(); renderFullCart(); });
function renderFullCart() {
  const cart = getCart();
  const main = document.getElementById('mainCart');
  if (!cart.length) {
    main.innerHTML = `<div class="col-12"><div class="empty-state"><i class="fas fa-shopping-cart"></i><h4>Your cart is empty</h4><a href="menu.html" class="btn btn-danger rounded-pill mt-3">Order Food</a></div></div>`;
    return;
  }
  const { subtotal, discount, deliveryFee, total, coupon } = getCartTotals();
  main.innerHTML = `
    <div class="col-lg-8">
      ${cart.map(i=>`<div class="d-flex align-items-center gap-3 p-3 mb-3 rounded-xl" style="background:var(--bg-card);border:1px solid var(--border-color);">
        <img src="${i.image}" alt="${i.name}" style="width:80px;height:80px;object-fit:cover;border-radius:10px;"/>
        <div class="flex-grow-1"><div class="fw-700">${i.name}</div><div class="text-danger fw-700">₹${i.price}</div></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="qty-btn" onclick="updateQty(${i.id},-1)">-</button>
          <span class="fw-700">${i.qty}</span>
          <button class="qty-btn" onclick="updateQty(${i.id},1)">+</button>
        </div>
        <div class="fw-700">₹${i.price*i.qty}</div>
        <button class="btn btn-sm text-danger border-0" onclick="removeFromCart(${i.id})"><i class="fas fa-trash"></i></button>
      </div>`).join('')}
      <a href="menu.html" class="btn btn-outline-danger rounded-pill"><i class="fas fa-arrow-left me-2"></i>Continue Ordering</a>
    </div>
    <div class="col-lg-4">
      <div class="cart-panel">
        <h5 class="fw-700 mb-3">Order Summary</h5>
        <div class="mb-3"><div class="d-flex gap-2"><input type="text" class="form-control" id="couponInput" placeholder="Coupon (FOOD10, FIRST20)…" value="${coupon}"/><button class="btn btn-outline-danger btn-sm" onclick="applyCoupon()">Apply</button></div>
        <div class="small text-muted mt-1">Try: FOOD10 · FIRST20 · FLAT50</div></div>
        <div class="summary-row"><span>Subtotal</span><span>₹${subtotal}</span></div>
        ${discount?`<div class="summary-row text-success"><span>Discount</span><span>-₹${discount}</span></div>`:''}
        <div class="summary-row"><span>Delivery</span><span>${deliveryFee?'₹'+deliveryFee:'FREE'}</span></div>
        <div class="summary-total"><span>Total</span><span class="text-danger">₹${total}</span></div>
        <a href="checkout.html" class="btn btn-danger w-100 rounded-pill mt-3 fw-700"><i class="fas fa-lock me-2"></i>Proceed to Checkout</a>
      </div>
    </div>`;
}
function applyCoupon() {
  const code = document.getElementById('couponInput').value.trim().toUpperCase();
  if (['FOOD10','FIRST20','FLAT50'].includes(code)) { localStorage.setItem('foodrush_coupon', code); showToast('Coupon applied!', 'success'); }
  else { showToast('Invalid coupon', 'danger'); }
  renderFullCart();
}
</script>
</body>
</html>
