<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Order Confirmed – FoodRush</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="css/style.css"/></head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fas fa-utensils me-2"></i>FoodRush</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-center gap-2">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-home me-1"></i>Home</a></li>
        <li class="nav-item"><a class="nav-link" href="restaurants.html"><i class="fas fa-store me-1"></i>Restaurants</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html"><i class="fas fa-utensils me-1"></i>Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="orders.html"><i class="fas fa-box me-1"></i>Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="cart.html"><i class="fas fa-shopping-cart me-1"></i>Cart <span class="cart-badge" id="cartCount">0</span></a></li>
        <li class="nav-item" id="authNav"><a class="nav-link" href="login.html"><i class="fas fa-user me-1"></i>Login</a></li>
        <li class="nav-item"><button class="theme-toggle" onclick="toggleTheme()"></button></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="text-center fade-in" style="max-width:500px;margin:auto;">
    <div style="font-size:5rem; animation: bounceIn .6s;">🎉</div>
    <h1 class="fw-800 mt-3">Order Confirmed!</h1>
    <p class="text-muted">Your food is being prepared and will be delivered soon!</p>
    <div style="background:var(--bg-card);border:2px dashed var(--border-color);border-radius:12px;padding:20px;margin:24px 0;">
      <div class="small text-muted mb-1">Order Reference</div>
      <div class="fw-800 fs-4 text-danger" id="orderRef">Loading…</div>
    </div>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a id="trackLink" href="#" class="btn btn-danger rounded-pill px-4"><i class="fas fa-map-marker-alt me-2"></i>Track Order</a>
      <a href="orders.html" class="btn btn-outline-danger rounded-pill px-4"><i class="fas fa-box me-2"></i>My Orders</a>
      <a href="index.html" class="btn btn-outline-secondary rounded-pill px-4"><i class="fas fa-home me-2"></i>Home</a>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    updateCartCount();
    checkAuth();
  });
  const order = JSON.parse(sessionStorage.getItem('foodrush_order') || '{}');
  const ref = order.ref || 'FR' + Date.now().toString().slice(-8);
  document.getElementById('orderRef').textContent = '#' + ref;
  document.getElementById('trackLink').href = 'order-tracking.html?oid=' + ref;
</script>
</body>
</html>
