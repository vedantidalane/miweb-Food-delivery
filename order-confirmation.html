<!DOCTYPE html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Order Confirmed – FoodRush</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="css/style.css"/></head>
<body style="min-height:100vh;display:flex;align-items:center;">
<div class="container py-5">
  <div class="text-center fade-in" style="max-width:500px;margin:auto;">
    <div style="font-size:5rem; animation: bounceIn .6s;">🎉</div>
    <h1 class="fw-800 mt-3">Order Confirmed!</h1>
    <p class="text-muted">Your food is being prepared and will be delivered soon!</p>
    <div style="background:var(--bg-card);border:2px dashed var(--border-color);border-radius:12px;padding:20px;margin:24px 0;">
      <div class="small text-muted mb-1">Order Reference</div>
      <div class="fw-800 fs-4 text-danger" id="orderRef">Loading…</div>
    </div>
    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:20px;text-align:left;margin-bottom:24px;">
      <div class="d-flex align-items-center gap-3 mb-2"><span style="width:30px;height:30px;background:#28a745;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;">✓</span><span>Order Received</span></div>
      <div class="d-flex align-items-center gap-3 mb-2"><span style="width:30px;height:30px;background:var(--border-color);color:var(--text-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;">🍳</span><span class="text-muted">Preparing your food…</span></div>
      <div class="d-flex align-items-center gap-3 mb-2"><span style="width:30px;height:30px;background:var(--border-color);color:var(--text-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;">🚴</span><span class="text-muted">Out for Delivery</span></div>
      <div class="d-flex align-items-center gap-3"><span style="width:30px;height:30px;background:var(--border-color);color:var(--text-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;">🏠</span><span class="text-muted">Delivered</span></div>
    </div>
    <div class="d-flex gap-3 justify-content-center">
      <a href="index.html" class="btn btn-danger rounded-pill px-4"><i class="fas fa-home me-2"></i>Home</a>
      <a href="menu.html" class="btn btn-outline-danger rounded-pill px-4">Order More</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script>
  const order = JSON.parse(sessionStorage.getItem('foodrush_order') || '{}');
  document.getElementById('orderRef').textContent = '#' + (order.ref || 'FR' + Date.now().toString().slice(-8));
</script>
</body>
</html>
