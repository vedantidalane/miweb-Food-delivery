<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food Menu – FoodRush</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fas fa-utensils me-2"></i>FoodRush</a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <a class="nav-link" href="restaurants.html">Restaurants</a>
      <a class="nav-link" href="cart.html"><i class="fas fa-shopping-cart me-1"></i>Cart <span class="cart-badge" id="cartCount">0</span></a>
      <span id="authNav"><a href="login.html" class="nav-link"><i class="fas fa-user me-1"></i>Login</a></span>
      <button class="theme-toggle" onclick="toggleTheme()"></button>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h1 class="section-title mb-2">Food Menu</h1>
  <p class="text-muted mb-4">Browse all dishes and add to cart</p>

  <!-- Search & Sort -->
  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <input type="text" class="form-control" id="foodSearch" placeholder="🔍 Search dishes…" oninput="renderMenu()"/>
    </div>
    <div class="col-md-3">
      <select class="form-select" id="sortFood" onchange="renderMenu()">
        <option value="">Sort By</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="rating">Highest Rated</option>
      </select>
    </div>
    <div class="col-md-3">
      <select class="form-select" id="typeFilter" onchange="renderMenu()">
        <option value="">All Types</option>
        <option value="veg">Veg Only</option>
        <option value="nonveg">Non-Veg Only</option>
      </select>
    </div>
  </div>

  <!-- Category Tabs -->
  <div class="filter-tabs mb-4" id="catTabs">
    <button class="filter-tab active" data-cat="" onclick="setCat(this,'')">All</button>
    <button class="filter-tab" data-cat="burger" onclick="setCat(this,'burger')">🍔 Burgers</button>
    <button class="filter-tab" data-cat="pizza" onclick="setCat(this,'pizza')">🍕 Pizza</button>
    <button class="filter-tab" data-cat="biryani" onclick="setCat(this,'biryani')">🍛 Biryani</button>
    <button class="filter-tab" data-cat="chinese" onclick="setCat(this,'chinese')">🥡 Chinese</button>
    <button class="filter-tab" data-cat="dessert" onclick="setCat(this,'dessert')">🍰 Desserts</button>
    <button class="filter-tab" data-cat="drinks" onclick="setCat(this,'drinks')">🍹 Drinks</button>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="d-flex justify-content-between mb-3">
        <span class="text-muted small" id="resultCount">0 items</span>
      </div>
      <div class="row g-4" id="foodGrid"></div>
    </div>

    <!-- Cart Panel -->
    <div class="col-lg-4">
      <div class="cart-panel" id="cartPanel">
        <h5 class="fw-700 mb-3"><i class="fas fa-shopping-cart me-2 text-danger"></i>Your Order</h5>
        <div id="cartItems"></div>
        <div id="cartSummary"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script>
  let currentCat = '';
  const params = new URLSearchParams(window.location.search);
  if (params.get('cat')) { currentCat = params.get('cat'); document.querySelector(`[data-cat="${currentCat}"]`)?.classList.add('active'); document.querySelector('[data-cat=""]')?.classList.remove('active'); }

  document.addEventListener('DOMContentLoaded', () => { updateCartCount(); checkAuth(); renderMenu(); renderCartPanel(); });

  function setCat(btn, cat) {
    currentCat = cat;
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderMenu();
  }

  function renderMenu() {
    let items = [...FOOD_ITEMS];
    const search = document.getElementById('foodSearch').value.toLowerCase();
    const sort = document.getElementById('sortFood').value;
    const type = document.getElementById('typeFilter').value;

    if (currentCat) items = items.filter(i => i.category === currentCat);
    if (search) items = items.filter(i => i.name.toLowerCase().includes(search));
    if (type) items = items.filter(i => i.type === type);
    if (sort === 'price-low') items.sort((a,b) => a.price - b.price);
    else if (sort === 'price-high') items.sort((a,b) => b.price - a.price);
    else if (sort === 'rating') items.sort((a,b) => b.rating - a.rating);

    document.getElementById('resultCount').textContent = `${items.length} item${items.length !== 1 ? 's' : ''} found`;
    const grid = document.getElementById('foodGrid');
    if (!items.length) {
      grid.innerHTML = `<div class="col-12"><div class="empty-state"><i class="fas fa-search"></i><h4>No items found</h4></div></div>`;
      return;
    }
    grid.innerHTML = items.map(i => `
      <div class="col-md-6">
        <div class="food-card">
          <div style="position:relative;">
            <img src="${i.image}" alt="${i.name}"/>
            <span style="position:absolute;top:10px;left:10px;background:${i.type==='veg'?'var(--success)':'#dc3545'};color:#fff;padding:2px 10px;border-radius:50px;font-size:.75rem;font-weight:600;">${i.type==='veg'?'🌿 VEG':'🍗 NON-VEG'}</span>
          </div>
          <div class="body">
            <div class="food-title">${i.name}</div>
            <div class="food-desc">${i.desc}</div>
            <div class="d-flex align-items-center justify-content-between mt-2">
              <div class="rating">★ ${i.rating}</div>
              <div>
                <span class="fw-700 text-danger">₹${i.price}</span>
                ${i.originalPrice ? `<del class="small text-muted ms-1">₹${i.originalPrice}</del>` : ''}
              </div>
            </div>
            <button class="btn-add-food" onclick="addToCart(${i.id})"><i class="fas fa-plus me-1"></i>Add to Cart</button>
          </div>
        </div>
      </div>`).join('');
  }

  function renderCartPanel() {
    const cart = getCart();
    const { subtotal, discount, deliveryFee, total } = getCartTotals();
    const items = document.getElementById('cartItems');
    const summary = document.getElementById('cartSummary');

    if (!cart.length) {
      items.innerHTML = `<div class="empty-state" style="padding:30px 0;"><i class="fas fa-shopping-cart" style="font-size:2.5rem;display:block;margin-bottom:10px;"></i><p>Your cart is empty</p></div>`;
      summary.innerHTML = '';
      return;
    }

    items.innerHTML = cart.map(i => `
      <div class="cart-item">
        <img src="${i.image}" alt="${i.name}" style="width:50px;height:50px;object-fit:cover;border-radius:8px;"/>
        <div class="flex-grow-1">
          <div class="small fw-600">${i.name}</div>
          <div class="small text-danger fw-700">₹${(i.price*i.qty).toLocaleString()}</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="updateQty(${i.id},-1)">-</button>
          <span style="min-width:20px;text-align:center;font-size:.9rem;">${i.qty}</span>
          <button class="qty-btn" onclick="updateQty(${i.id},1)">+</button>
        </div>
        <button class="btn btn-sm text-danger border-0" onclick="removeFromCart(${i.id})"><i class="fas fa-trash-alt"></i></button>
      </div>`).join('');

    summary.innerHTML = `
      <hr class="my-2"/>
      <div class="summary-row small"><span>Subtotal</span><span>₹${subtotal}</span></div>
      ${discount>0?`<div class="summary-row small text-success"><span>Discount</span><span>-₹${discount}</span></div>`:''}
      <div class="summary-row small"><span>Delivery</span><span>${deliveryFee?'₹'+deliveryFee:'<span class="text-success">FREE</span>'}</span></div>
      <div class="summary-total mt-1"><span>Total</span><span class="text-danger">₹${total}</span></div>
      <a href="cart.html" class="btn btn-danger w-100 rounded-pill mt-3 fw-600"><i class="fas fa-shopping-cart me-2"></i>View Full Cart</a>`;
  }
</script>
</body>
</html>
